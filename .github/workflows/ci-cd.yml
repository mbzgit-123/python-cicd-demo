
# ============================================================
# 工作流名称
# 在 GitHub 仓库的 Actions 页面中显示这个名称
# ============================================================
name: Python CI/CD Demo


# ============================================================
# 触发条件（什么时候自动执行这个工作流）
# ============================================================
on:
  # 条件一：当代码被推送到 main 分支时，自动执行
  push:
    branches:
      - main

  # 条件二：当有人针对 main 分支创建或更新 Pull Request 时，自动执行
  # Pull Request（简称 PR）是向目标分支申请合并代码的操作
  pull_request:
    branches:
      - main


# ============================================================
# 权限配置
# ============================================================
permissions:
  # 只授予工作流读取仓库代码的权限
  # 对于当前的代码检查和自动化测试来说，这个权限已经足够
  contents: read


# ============================================================
# Jobs：定义工作流中需要执行的任务
# 一个工作流可以包含一个或多个 Job
# ============================================================
jobs:
  # ----------------------------------------------------------
  # Job 1：test
  # 这是任务的唯一标识符，可以自定义
  # ----------------------------------------------------------
  test:
    # 任务显示名称
    # 在 GitHub Actions 执行页面中显示为 Run Python Tests
    name: Run Python Tests

    # 指定运行环境
    # ubuntu-latest 表示使用 GitHub 提供的最新版 Ubuntu 环境
    # 每次运行都会在一个独立的运行环境中执行
    runs-on: ubuntu-latest

    # --------------------------------------------------------
    # Steps：定义这个 Job 内部具体执行的步骤
    # 这些步骤按照从上到下的顺序依次执行
    # --------------------------------------------------------
    steps:

      # 第 1 步：下载仓库代码
      # GitHub Actions 的运行环境是独立的，需要先获取项目代码
      - name: Checkout Code
        # 使用 GitHub 官方提供的 actions/checkout 插件
        # v4 表示使用该插件的第 4 个主要版本
        uses: actions/checkout@v4


      # 第 2 步：安装并配置 Python 环境
      - name: Set up Python
        # 使用 GitHub 官方提供的 Python 环境配置插件
        uses: actions/setup-python@v5

        # with 用于向插件传递配置参数
        with:
          # 指定本项目使用 Python 3.11
          python-version: "3.11"


      # 第 3 步：安装项目所需要的依赖
      - name: Install Dependencies
        # run 表示直接在运行环境中执行命令
        # -r 表示读取 requirements.txt 文件中的依赖列表
        # 安装 FastAPI、Pytest、Ruff 等项目依赖
        run: pip install -r requirements.txt


      # 第 4 步：执行 Ruff 代码质量检查
      - name: Run Ruff
        # 检查项目中的 Python 代码
        # 例如：未使用的导入、导入顺序错误、代码规范问题等
        # 如果发现未忽略的错误，Ruff 会返回非零退出码
        # 当前 Job 将失败，后续步骤默认不会继续执行
        run: ruff check .


      # 第 5 步：执行 Pytest 自动化测试
      - name: Run Tests
        # -v 表示详细输出测试结果
        # Pytest 会自动发现并执行符合命名规则的测试函数
        # 例如：test_app.py 中以 test_ 开头的测试函数
        run: pytest -v
