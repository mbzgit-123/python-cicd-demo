
name: Python CI/CD Demo

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      # 1. 下载代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 安装 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 安装依赖
      - name: Install Dependencies
        run: pip install -r requirements.txt

      # 4. Ruff 代码质量检查
      - name: Run Ruff
        run: ruff check .

      # 5. Pytest 自动化测试
      - name: Run Tests
        run: pytest -v
